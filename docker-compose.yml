
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI belum diatur di file .env}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
    restart: unless-stopped
